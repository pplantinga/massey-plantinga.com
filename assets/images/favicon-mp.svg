<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b827fc"/>
      <stop offset="100%" stop-color="#2c71ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container Badge -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="#262d38" stroke-width="6"/>

  <!-- Interlocking M P Monogram -->
  <g filter="url(#shadow)">
    <!-- M Left Stem -->
    <path d="M 120 376 L 120 136 L 192 270 L 264 136 L 264 376" 
          fill="none" 
          stroke="url(#purpleGrad)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- P Outer Loop intertwined with M right stem -->
    <path d="M 264 136 L 336 136 C 378 136 408 166 408 208 C 408 250 378 280 336 280 L 264 280" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
